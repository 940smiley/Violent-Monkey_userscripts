name: Classify Userscripts

on:
  pull_request:
    paths:
      - 'scripts/**/*.user.js'
      - 'tools/classify_scripts.py'
      - 'scripts-index.json'
  push:
    branches: ['main']
    paths:
      - 'scripts/**/*.user.js'
      - 'tools/classify_scripts.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rebuild scripts-index.json
        run: python tools/classify_scripts.py --verbose

      - name: Validate index on PR
        if: github.event_name == 'pull_request'
        run: python tools/classify_scripts.py --check

      - name: Commit updated index on push
        if: github.event_name == 'push'
        run: |
          if [[ -n "$(git status --porcelain scripts-index.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts-index.json
            git commit -m "chore(index): update scripts-index.json"
            git push
          else
            echo "No index changes to commit."
          fi
